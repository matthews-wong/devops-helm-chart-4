apiVersion: v1
kind: Pod
metadata:
  name: {{ include "echo-web.fullname" . }}-test-connection
  labels:
    {{- include "echo-web.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
  containers:
    - name: curl
      image: "curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - "http://{{ include "echo-web.fullname" . }}:{{ .Values.service.port }}/"
