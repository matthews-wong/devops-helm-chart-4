# Default values for echo-web.
# Environment overrides live in values-dev.yaml / values-prod.yaml and are
# layered on top with `-f values.yaml -f values-<env>.yaml`.

replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  # Digest pin for the multi-arch index; keeps the tag human-readable while
  # the digest is what's actually pulled.
  digest: "sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}

# nginx-unprivileged already runs as uid/gid 101 on port 8080.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

indexHtml: |
  <!doctype html>
  <html>
    <head><title>echo-web</title></head>
    <body><h1>Hello from echo-web</h1></body>
  </html>

probes:
  # startupProbe gates liveness/readiness, so their initialDelaySeconds stay
  # at 0 - the startup check already covers "give it time to come up".
  startup:
    path: /
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    path: /
    initialDelaySeconds: 0
    periodSeconds: 10
  readiness:
    path: /
    initialDelaySeconds: 0
    periodSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
